name: 💡 Idea or feature request
description: Something the app or the MCP server should do
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you want
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why (optional)
      description: What you were trying to do when you wished it existed.
    validations:
      required: false
